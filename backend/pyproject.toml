[project]
name = "substituicao"
version = "0.1.0"
description = "Sistema de convocação de professores substitutos da rede municipal"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E9", "B", "I"]
ignore = ["B008", "B904", "B023"]
