# Produção mínima numa VPS. Coloque um proxy reverso com HTTPS (Caddy/nginx) na frente da porta 8000:
# o webhook do Telegram exige HTTPS.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: subst
      POSTGRES_USER: subst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      TZ: America/Sao_Paulo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subst"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SUBST_DATABASE_URL: postgresql+psycopg://subst:${POSTGRES_PASSWORD}@db:5432/subst
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "python -m app.cli init-db && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --workers 2"
    ports: ["127.0.0.1:8000:8000"]

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SUBST_DATABASE_URL: postgresql+psycopg://subst:${POSTGRES_PASSWORD}@db:5432/subst
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }
    command: python -m app.worker

volumes:
  pgdata:
